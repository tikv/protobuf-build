[package]
name = "tests"
version = "0.1.0"
authors = ["Neil Shen <overvenus@gmail.com>"]
edition = "2018"
publish = false
build = "build.rs"

[features]
protobuf-codec = ["protobuf-build/protobuf-codec"]
prost-codec = ["protobuf-build/prost-codec", "dep:prost-current"]
grpcio-protobuf-codec = ["protobuf-codec", "protobuf-build/grpcio-protobuf-codec"]
grpcio-prost-codec = ["protobuf-build/grpcio-prost-codec", "dep:prost-legacy"]

[dependencies]
protobuf = "2"
prost-current = { package = "prost", version = "0.14", optional = true }
prost-legacy = { package = "prost", version = "0.11", optional = true }
lazy_static = "1.4"

[build-dependencies]
protobuf-build = { path = "../", default-features = false }
